<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNPSC PDF to JSON Converter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f1419, #1a2332);
      color: #e8edf7;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #121b2e;
      border: 1px solid #22304a;
      border-radius: 14px;
      padding: 30px;
    }
    h1 { text-align: center; color: #3b82f6; margin-bottom: 30px; }
    .section {
      background: #0f1726;
      border: 1px solid #22304a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 1.1rem;
      color: #3b82f6;
      margin-top: 0;
    }
    .upload-area {
      border: 2px dashed #22304a;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-area:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
    .upload-area.dragover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    input[type="file"] { display: none; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #64748b; cursor: not-allowed; }
    .btn.secondary { background: #64748b; }
    .btn.success { background: #22c55e; }
    .btn.download { background: #f59e0b; }
    .file-info {
      margin-top: 15px;
      padding: 12px;
      background: rgba(34, 197, 94, 0.1);
      border-left: 3px solid #22c55e;
      border-radius: 6px;
      display: none;
    }
    .file-info.show { display: block; }
    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    .form-group label {
      font-size: 0.9rem;
      color: #93a1bb;
      margin-bottom: 6px;
    }
    .form-group input,
    .form-group select {
      background: #0f1726;
      border: 1px solid #22304a;
      color: #e8edf7;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 0.9rem;
    }
    .status.show { display: block; }
    .status.info { background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; color: #93ccfd; }
    .status.success { background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; color: #86efac; }
    .status.error { background: rgba(239, 68, 68, 0.1); border-left: 3px solid #ef4444; color: #fca5a5; }
    .output-section {
      display: none;
    }
    .output-section.show { display: block; }
    .json-preview {
      background: #0a0e16;
      border: 1px solid #22304a;
      border-radius: 8px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Monaco', monospace;
      font-size: 0.85rem;
      color: #6ee7b7;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .buttons-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .progress {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }
    .progress.show { display: block; }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      width: 0%;
      transition: width 0.3s;
    }
    @media (max-width: 600px) {
      .container { padding: 15px; }
      .settings { grid-template-columns: 1fr; }
      .buttons-group { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📄 TNPSC PDF to JSON Converter</h1>

  <!-- PDF Upload Section -->
  <div class="section">
    <h2>Step 1: Upload PDF</h2>
    <div class="upload-area" id="uploadArea">
      <div style="font-size: 3rem; margin-bottom: 10px;">📁</div>
      <div style="font-size: 1.1rem; margin-bottom: 8px;">Drag PDF here or click to upload</div>
      <div style="font-size: 0.85rem; color: #93a1bb;">Supports single or multi-page PDFs</div>
      <input type="file" id="pdfInput" accept=".pdf" />
    </div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <!-- Settings Section -->
  <div class="section">
    <h2>Step 2: Configure</h2>
    <div class="settings">
      <div class="form-group">
        <label>Topic/Class Name (Default)</label>
        <input type="text" id="defaultTopic" placeholder="e.g., அரசியல், History" value="TNPSC" />
      </div>
      <div class="form-group">
        <label>Current API Key (Auto-rotate on limit)</label>
        <input type="text" id="currentApiKey" placeholder="Will auto-select from pool..." readonly style="background:#0a0e16;" />
      </div>
    </div>

    <div class="section">
      <h2>API Keys Pool (Click to add/remove)</h2>
      <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap:10px; margin-bottom:15px;" id="apiKeysContainer"></div>
      <button class="btn secondary" onclick="addApiKeySlot()">+ Add Key Slot</button>
    </div>
  </div>

  <!-- Processing Section -->
  <div class="section">
    <h2>Step 3: Process & Extract</h2>
    <div id="status" class="status"></div>
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="buttons-group">
      <button class="btn" id="processBtn" onclick="processPDF()">🚀 Extract Questions</button>
      <button class="btn secondary" id="clearBtn" onclick="clearAll()">🗑️ Clear</button>
    </div>
  </div>

  <!-- Output Section -->
  <div class="section output-section" id="outputSection">
    <h2>Step 4: JSON Output</h2>
    <div style="font-size: 0.9rem; color: #93a1bb; margin-bottom: 15px;" id="statsInfo"></div>
    <div class="json-preview" id="jsonPreview"></div>
    <div class="buttons-group">
      <button class="btn download" id="downloadBtn" onclick="downloadJSON()">⬇️ Download JSON</button>
      <button class="btn secondary" id="copyBtn" onclick="copyToClipboard()">📋 Copy JSON</button>
    </div>
  </div>
</div>

<script>
  // Set pdf.js worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let pdfFile = null;
  let extractedJSON = null;
  let apiKeys = [];
  let currentKeyIndex = 0;

  // API Keys Pool Manager
  function initApiKeys() {
    const saved = localStorage.getItem('tnpsc_api_keys');
    apiKeys = saved ? JSON.parse(saved) : Array(5).fill('');
    renderApiKeysUI();
  }

  function saveApiKeys() {
    localStorage.setItem('tnpsc_api_keys', JSON.stringify(apiKeys));
  }

  function renderApiKeysUI() {
    const container = document.getElementById('apiKeysContainer');
    container.innerHTML = '';
    apiKeys.forEach((key, idx) => {
      const keyEl = document.createElement('div');
      keyEl.style.cssText = `
        background: #0f1726;
        border: 1px solid ${currentKeyIndex === idx ? '#3b82f6' : '#22304a'};
        border-radius: 8px;
        padding: 12px;
        position: relative;
        ${currentKeyIndex === idx ? 'box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);' : ''}
      `;
      const isActive = currentKeyIndex === idx;
      keyEl.innerHTML = `
        <div style="font-size:0.75rem; color:#93a1bb; margin-bottom:6px;">Key ${idx + 1} ${isActive ? '(ACTIVE)' : ''}</div>
        <input type="text" value="${key}" placeholder="sk-ant-..." onchange="updateApiKey(${idx}, this.value)"
          style="width:100%; background:#0a0e16; border:1px solid #22304a; color:#e8edf7; padding:8px; border-radius:4px; font-size:0.8rem;" />
        <div style="margin-top:8px; display:flex; gap:6px;">
          <button style="flex:1; background:#ef4444; color:white; border:none; padding:6px; border-radius:4px; font-size:0.75rem; cursor:pointer;" onclick="removeApiKey(${idx})">Delete</button>
          <button style="flex:1; background:${isActive ? '#3b82f6' : '#64748b'}; color:white; border:none; padding:6px; border-radius:4px; font-size:0.75rem; cursor:pointer;" onclick="setActiveKey(${idx})">Use</button>
        </div>
      `;
      container.appendChild(keyEl);
    });
    updateCurrentKeyDisplay();
  }

  function updateApiKey(idx, value) {
    apiKeys[idx] = value.trim();
    saveApiKeys();
    renderApiKeysUI();
  }

  function removeApiKey(idx) {
    if (apiKeys.length <= 1) {
      alert('Keep at least 1 key slot');
      return;
    }
    apiKeys.splice(idx, 1);
    if (currentKeyIndex >= apiKeys.length) currentKeyIndex = 0;
    saveApiKeys();
    renderApiKeysUI();
  }

  function addApiKeySlot() {
    if (apiKeys.length >= 10) {
      alert('Maximum 10 keys allowed');
      return;
    }
    apiKeys.push('');
    saveApiKeys();
    renderApiKeysUI();
  }

  function setActiveKey(idx) {
    currentKeyIndex = idx;
    renderApiKeysUI();
  }

  function updateCurrentKeyDisplay() {
    const active = apiKeys[currentKeyIndex] || '';
    document.getElementById('currentApiKey').value = active ? `${active.substring(0, 20)}...` : 'No API keys added';
  }

  function getNextApiKey() {
    // Find next available key with retry
    for (let i = 0; i < apiKeys.length; i++) {
      const idx = (currentKeyIndex + i) % apiKeys.length;
      if (apiKeys[idx]?.trim()) {
        currentKeyIndex = idx;
        updateCurrentKeyDisplay();
        return apiKeys[idx];
      }
    }
    return null;
  }

  initApiKeys();

  const uploadArea = document.getElementById('uploadArea');
  const pdfInput = document.getElementById('pdfInput');
  const fileInfo = document.getElementById('fileInfo');
  const status = document.getElementById('status');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const outputSection = document.getElementById('outputSection');

  // Drag and drop
  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files[0]?.type === 'application/pdf') {
      pdfInput.files = e.dataTransfer.files;
      handlePDFSelect(e.dataTransfer.files[0]);
    } else {
      showStatus('Please upload a PDF file', 'error');
    }
  });

  uploadArea.addEventListener('click', () => pdfInput.click());
  pdfInput.addEventListener('change', (e) => handlePDFSelect(e.target.files[0]));

  function handlePDFSelect(file) {
    if (file?.type !== 'application/pdf') {
      showStatus('Invalid file. Please upload a PDF.', 'error');
      return;
    }
    pdfFile = file;
    fileInfo.classList.add('show');
    fileInfo.innerHTML = `✅ <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus('', '');
    outputSection.classList.remove('show');
  }

  function showStatus(msg, type) {
    if (!msg) {
      status.classList.remove('show');
      return;
    }
    status.textContent = msg;
    status.className = `status show ${type}`;
  }

  function showProgress(percent) {
    progress.classList.add('show');
    progressBar.style.width = percent + '%';
  }

  async function processPDF() {
    if (!pdfFile) {
      showStatus('Please upload a PDF first', 'error');
      return;
    }

    const apiKey = getNextApiKey();
    if (!apiKey) {
      showStatus('Please add at least one Claude API key', 'error');
      return;
    }

    document.getElementById('processBtn').disabled = true;
    showStatus('Reading PDF...', 'info');
    showProgress(10);

    try {
      // Extract text from PDF
      const pdfArrayBuffer = await pdfFile.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(pdfArrayBuffer).promise;
      
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        fullText += textContent.items.map(item => item.str).join('') + '\n---PAGE_BREAK---\n';
        showProgress(10 + ((i / pdf.numPages) * 30));
      }

      showStatus(`Extracting questions (Key ${currentKeyIndex + 1}/${apiKeys.length})...`, 'info');
      showProgress(40);

      // Send to Claude Sonnet with retry on rate limit
      const questions = await extractQuestionsWithClaude(fullText, apiKey);
      
      extractedJSON = questions;
      displayResults(questions);
      
      document.getElementById('processBtn').disabled = false;
      showStatus(`✅ Extracted ${questions.length} questions successfully!`, 'success');
      showProgress(100);
      setTimeout(() => progress.classList.remove('show'), 1500);

    } catch (error) {
      document.getElementById('processBtn').disabled = false;
      
      // If rate limited, try next key
      if (error.message.includes('rate_limit') || error.message.includes('429')) {
        showStatus(`Rate limit on Key ${currentKeyIndex + 1}. Trying next key...`, 'info');
        setTimeout(() => processPDF(), 1000);
      } else {
        showStatus(`Error: ${error.message}`, 'error');
        progress.classList.remove('show');
      }
    }
  }

  async function extractQuestionsWithClaude(text, apiKey) {
    const defaultTopic = document.getElementById('defaultTopic').value || 'TNPSC';
    
    const prompt = `You are an expert at extracting TNPSC exam questions from PDF text. 

Extract ALL questions from this text and return a valid JSON array. Each question must have:
- "c": Topic/Class name (use "${defaultTopic}" if unclear, or infer from context)
- "q": Question text (clean, no numbers/bullets)
- "o": Array of exactly 4 options [opt1, opt2, opt3, opt4]
- "a": Correct answer index (0-3, where 0 is first option)
- "e": Explanation (keep it concise, 1-2 sentences)

IMPORTANT RULES:
1. Return ONLY valid JSON array, nothing else
2. Each option must be text only (no A), B), etc.)
3. If answer is marked as "A)", "1)", etc., convert to index (0-3)
4. If explanation is missing, use empty string ""
5. Clean up OCR errors (maintain meaning)
6. Process ALL pages - don't stop early

PDF TEXT:
${text}

Return as: [{"c":"","q":"","o":["","","",""],"a":0,"e":""},...]`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      const errMsg = err.error?.message || 'API Error';
      
      // Detect rate limit
      if (response.status === 429 || errMsg.includes('rate_limit')) {
        throw new Error('rate_limit: API key quota exceeded');
      }
      throw new Error(errMsg);
    }

    const data = await response.json();
    const content = data.content[0].text;
    
    try {
      // Try to extract JSON from response
      const jsonMatch = content.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('No JSON found in response');
      return JSON.parse(jsonMatch[0]);
    } catch (e) {
      throw new Error('Failed to parse API response: ' + e.message);
    }
  }

  function displayResults(questions) {
    outputSection.classList.add('show');
    
    const stats = `Total Questions: ${questions.length} | Topics: ${new Set(questions.map(q => q.c)).size}`;
    document.getElementById('statsInfo').textContent = stats;
    
    const preview = JSON.stringify(questions, null, 2);
    document.getElementById('jsonPreview').textContent = preview.substring(0, 2000) + (preview.length > 2000 ? '\n... (truncated, download full JSON)' : '');
  }

  function downloadJSON() {
    if (!extractedJSON) return;
    const dataStr = JSON.stringify(extractedJSON, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `questions-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function copyToClipboard() {
    if (!extractedJSON) return;
    navigator.clipboard.writeText(JSON.stringify(extractedJSON, null, 2));
    alert('JSON copied to clipboard!');
  }

  function clearAll() {
    pdfFile = null;
    extractedJSON = null;
    pdfInput.value = '';
    fileInfo.classList.remove('show');
    outputSection.classList.remove('show');
    progress.classList.remove('show');
    status.classList.remove('show');
    document.getElementById('processBtn').disabled = false;
  }
</script>

</body>
</html>
