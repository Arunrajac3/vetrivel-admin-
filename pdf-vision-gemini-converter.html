<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TNPSC PDF to JSON Converter (Vision + Gemini)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f1419, #1a2332);
      color: #e8edf7;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #121b2e;
      border: 1px solid #22304a;
      border-radius: 14px;
      padding: 30px;
    }
    h1 { text-align: center; color: #3b82f6; margin-bottom: 30px; }
    .section {
      background: #0f1726;
      border: 1px solid #22304a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 1.1rem;
      color: #3b82f6;
      margin-top: 0;
    }
    .upload-area {
      border: 2px dashed #22304a;
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .upload-area:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
    .upload-area.dragover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); }
    input[type="file"] { display: none; }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #64748b; cursor: not-allowed; }
    .btn.secondary { background: #64748b; }
    .btn.download { background: #f59e0b; }
    .file-info {
      margin-top: 15px;
      padding: 12px;
      background: rgba(34, 197, 94, 0.1);
      border-left: 3px solid #22c55e;
      border-radius: 6px;
      display: none;
    }
    .file-info.show { display: block; }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }
    .form-group label {
      font-size: 0.9rem;
      color: #93a1bb;
      margin-bottom: 6px;
    }
    .form-group input {
      background: #0a0e16;
      border: 1px solid #22304a;
      color: #e8edf7;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-size: 0.9rem;
    }
    .status.show { display: block; }
    .status.info { background: rgba(59, 130, 246, 0.1); border-left: 3px solid #3b82f6; color: #93ccfd; }
    .status.success { background: rgba(34, 197, 94, 0.1); border-left: 3px solid #22c55e; color: #86efac; }
    .status.error { background: rgba(239, 68, 68, 0.1); border-left: 3px solid #ef4444; color: #fca5a5; }
    .output-section {
      display: none;
    }
    .output-section.show { display: block; }
    .json-preview {
      background: #0a0e16;
      border: 1px solid #22304a;
      border-radius: 8px;
      padding: 15px;
      max-height: 400px;
      overflow-y: auto;
      font-family: 'Monaco', monospace;
      font-size: 0.85rem;
      color: #6ee7b7;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    .buttons-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .progress {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 15px;
      display: none;
    }
    .progress.show { display: block; }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      width: 0%;
      transition: width 0.3s;
    }
    .api-status {
      font-size: 0.8rem;
      color: #22c55e;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>📄 TNPSC PDF to JSON Converter</h1>
  <div class="api-status">✅ Using: Google Cloud Vision API + Gemini API (Free Tier)</div>

  <!-- PDF Upload Section -->
  <div class="section">
    <h2>Step 1: Upload PDF</h2>
    <div class="upload-area" id="uploadArea">
      <div style="font-size: 3rem; margin-bottom: 10px;">📁</div>
      <div style="font-size: 1.1rem; margin-bottom: 8px;">Drag PDF here or click to upload</div>
      <div style="font-size: 0.85rem; color: #93a1bb;">Single or multi-page TNPSC question PDFs</div>
      <input type="file" id="pdfInput" accept=".pdf" />
    </div>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <!-- Settings Section -->
  <div class="section">
    <h2>Step 2: Configure</h2>
    <div class="form-group">
      <label>Topic/Class Name (Default)</label>
      <input type="text" id="defaultTopic" placeholder="e.g., அரசியல், History" value="TNPSC" />
    </div>
  </div>

  <!-- Processing Section -->
  <div class="section">
    <h2>Step 3: Process & Extract</h2>
    <div id="status" class="status"></div>
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="buttons-group">
      <button class="btn" id="processBtn" onclick="processPDF()">🚀 Extract Questions</button>
      <button class="btn secondary" id="clearBtn" onclick="clearAll()">🗑️ Clear</button>
    </div>
  </div>

  <!-- Output Section -->
  <div class="section output-section" id="outputSection">
    <h2>Step 4: JSON Output</h2>
    <div style="font-size: 0.9rem; color: #93a1bb; margin-bottom: 15px;" id="statsInfo"></div>
    <div class="json-preview" id="jsonPreview"></div>
    <div class="buttons-group">
      <button class="btn download" id="downloadBtn" onclick="downloadJSON()">⬇️ Download JSON</button>
      <button class="btn secondary" id="copyBtn" onclick="copyToClipboard()">📋 Copy JSON</button>
    </div>
  </div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const GOOGLE_API_KEY = 'AIzaSyDRLa2a6UMRrPRlYxOexpUoFfILOF_ufUU';
  const VISION_API_URL = 'https://vision.googleapis.com/v1/images:annotate?key=' + GOOGLE_API_KEY;
  const GEMINI_API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + GOOGLE_API_KEY;

  let pdfFile = null;
  let extractedJSON = null;

  const uploadArea = document.getElementById('uploadArea');
  const pdfInput = document.getElementById('pdfInput');
  const fileInfo = document.getElementById('fileInfo');
  const status = document.getElementById('status');
  const progress = document.getElementById('progress');
  const progressBar = document.getElementById('progressBar');
  const outputSection = document.getElementById('outputSection');

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    if (e.dataTransfer.files[0]?.type === 'application/pdf') {
      pdfInput.files = e.dataTransfer.files;
      handlePDFSelect(e.dataTransfer.files[0]);
    } else {
      showStatus('Please upload a PDF file', 'error');
    }
  });

  uploadArea.addEventListener('click', () => pdfInput.click());
  pdfInput.addEventListener('change', (e) => handlePDFSelect(e.target.files[0]));

  function handlePDFSelect(file) {
    if (file?.type !== 'application/pdf') {
      showStatus('Invalid file. Please upload a PDF.', 'error');
      return;
    }
    pdfFile = file;
    fileInfo.classList.add('show');
    fileInfo.innerHTML = `✅ <strong>${file.name}</strong> (${(file.size / 1024).toFixed(1)} KB)`;
    showStatus('', '');
    outputSection.classList.remove('show');
  }

  function showStatus(msg, type) {
    if (!msg) {
      status.classList.remove('show');
      return;
    }
    status.textContent = msg;
    status.className = `status show ${type}`;
  }

  function showProgress(percent) {
    progress.classList.add('show');
    progressBar.style.width = percent + '%';
  }

  async function processPDF() {
    if (!pdfFile) {
      showStatus('Please upload a PDF first', 'error');
      return;
    }

    document.getElementById('processBtn').disabled = true;
    showStatus('Reading PDF and extracting text...', 'info');
    showProgress(10);

    try {
      const pdfArrayBuffer = await pdfFile.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(pdfArrayBuffer).promise;
      
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        fullText += textContent.items.map(item => item.str).join(' ') + '\n---PAGE_BREAK---\n';
        showProgress(10 + ((i / pdf.numPages) * 30));
      }

      showStatus('Parsing questions with Gemini AI...', 'info');
      showProgress(50);

      const questions = await parseQuestionsWithGemini(fullText);
      
      extractedJSON = questions;
      displayResults(questions);
      
      document.getElementById('processBtn').disabled = false;
      showStatus(`✅ Extracted ${questions.length} questions successfully!`, 'success');
      showProgress(100);
      setTimeout(() => progress.classList.remove('show'), 1500);

    } catch (error) {
      document.getElementById('processBtn').disabled = false;
      showStatus(`Error: ${error.message}`, 'error');
      progress.classList.remove('show');
    }
  }

  async function parseQuestionsWithGemini(text) {
    const defaultTopic = document.getElementById('defaultTopic').value || 'TNPSC';
    
    const prompt = `You are an expert at extracting TNPSC exam questions from PDF text.

Extract ALL questions from this text and return ONLY a valid JSON array. Each question must have:
- "c": Topic/Class name (use "${defaultTopic}" if unclear, or infer from context)
- "q": Question text (clean, no numbers/bullets)
- "o": Array of exactly 4 options [opt1, opt2, opt3, opt4]
- "a": Correct answer index (0-3, where 0 is first option)
- "e": Explanation (keep concise, 1-2 sentences)

IMPORTANT:
1. Return ONLY valid JSON array, nothing else
2. Each option must be text only (no A), B), etc.)
3. Clean up OCR errors but maintain meaning
4. Process ALL pages - don't stop early

PDF TEXT:
${text}

Return as: [{"c":"","q":"","o":["","","",""],"a":0,"e":""},...]`;

    const response = await fetch(GEMINI_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              {
                text: prompt
              }
            ]
          }
        ]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'Gemini API Error');
    }

    const data = await response.json();
    const content = data.candidates[0].content.parts[0].text;
    
    try {
      const jsonMatch = content.match(/\[[\s\S]*\]/);
      if (!jsonMatch) throw new Error('No JSON found in response');
      return JSON.parse(jsonMatch[0]);
    } catch (e) {
      throw new Error('Failed to parse Gemini response: ' + e.message);
    }
  }

  function displayResults(questions) {
    outputSection.classList.add('show');
    
    const stats = `Total Questions: ${questions.length} | Topics: ${new Set(questions.map(q => q.c)).size}`;
    document.getElementById('statsInfo').textContent = stats;
    
    const preview = JSON.stringify(questions, null, 2);
    document.getElementById('jsonPreview').textContent = preview.substring(0, 2000) + (preview.length > 2000 ? '\n... (truncated, download full JSON)' : '');
  }

  function downloadJSON() {
    if (!extractedJSON) return;
    const dataStr = JSON.stringify(extractedJSON, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `questions-${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function copyToClipboard() {
    if (!extractedJSON) return;
    navigator.clipboard.writeText(JSON.stringify(extractedJSON, null, 2));
    alert('JSON copied to clipboard!');
  }

  function clearAll() {
    pdfFile = null;
    extractedJSON = null;
    pdfInput.value = '';
    fileInfo.classList.remove('show');
    outputSection.classList.remove('show');
    progress.classList.remove('show');
    status.classList.remove('show');
    document.getElementById('processBtn').disabled = false;
  }
</script>

</body>
</html>
